<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Contraseña</title>
    <link rel="stylesheet" href="../CSS/EstilosCrearContra.css">
</head>
<body>

<div id="Contenedor">
    <header>
        <img src="../Imagenes/logo.png" id="logo">
        <h1 align="center">Carniceria "Mi Mary"</h1>
        <nav>
            <ul>
                <li><a href="../HTML/IniciarSecion.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>
</div>

<section>
    <section id="uno">

        <form onsubmit="return guardarDatos()">

            <h2>Completa tu registro</h2>

            <!-- VALIDACIONES VISUALES -->
            <div class="req"><input type="checkbox" id="Check1" disabled> Mínimo 8 caracteres</div>
            <div class="req"><input type="checkbox" id="Check2" disabled> Una mayúscula</div>
            <div class="req"><input type="checkbox" id="Check3" disabled> Un número</div>
            <div class="req"><input type="checkbox" id="Check4" disabled> Un símbolo (!@#$%&)</div>

            <!-- PASSWORD -->
            <input type="password" id="password1" placeholder="Crear contraseña" oninput="validar()" required>
            <br><br>

            <input type="password" id="password2" placeholder="Confirmar contraseña" oninput="validar()" required>
            <br><br>

            <!-- TELEFONO -->
            <input type="text" id="telefono" placeholder="Teléfono" required>
            <br><br>

            <!-- DIRECCION -->
            <input type="text" id="direccion" placeholder="Dirección" required>
            <br><br>

            <button type="submit" id="siguiente">Guardar</button>

            <p id="mensaje"></p>

        </form>

    </section>
</section>

<script>
// Obtener correo desde URL (?correo=...)
const params = new URLSearchParams(window.location.search)
const correo = params.get('correo')

// VALIDAR PASSWORD
function validar() {

    const pass = document.getElementById("password1").value;
    const pass2 = document.getElementById("password2").value;

    document.getElementById("Check1").checked = pass.length >= 8;
    document.getElementById("Check2").checked = /[A-Z]/.test(pass);
    document.getElementById("Check3").checked = /[0-9]/.test(pass);
    document.getElementById("Check4").checked = /[^A-Za-z0-9]/.test(pass);

    const coinciden = pass === pass2;

    document.getElementById("mensaje").innerText =
        (pass2.length > 0 && !coinciden) ? "Las contraseñas no coinciden" :
        (coinciden && pass.length > 0) ? "Contraseñas correctas" : "";

    document.getElementById("mensaje").style.color = coinciden ? "green" : "red";
}

// GUARDAR DATOS
function guardarDatos() {

    const password = document.getElementById("password1").value;
    const password2 = document.getElementById("password2").value;
    const telefono = document.getElementById("telefono").value.trim();
    const direccion = document.getElementById("direccion").value.trim();

    // Obtener correo desde URL
    const params = new URLSearchParams(window.location.search);
    const correo = params.get('correo');

    console.log("Enviando:", { correo, password, telefono, direccion });

    // Validar contraseña
    if (password !== password2) {
        alert("Las contraseñas no coinciden");
        return false;
    }

    // Validar teléfono
    if (!/^[0-9]+$/.test(telefono)) {
        alert("El teléfono solo debe contener números");
        return false;
    }

    // Validar que no venga vacío
    if (!correo || !telefono || !direccion) {
        alert("Faltan datos, verifica el formulario");
        return false;
    }

    fetch('http://localhost:3000/api/crear-password', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            correo: correo,
            password: password,
            telefono: telefono,
            direccion: direccion
        })
    })
    .then(res => res.json())
    .then(data => {
        console.log("Respuesta:", data);

        if (data.error) {
            alert(data.error);
        } else {
            alert(data.mensaje);
            window.location.href = '../HTML/IniciarSecion.html';
        }
    })
    .catch(err => {
        console.error("Error:", err);
        alert("Error al guardar datos");
    });

    return false;
}
</script>

</body>
</html>

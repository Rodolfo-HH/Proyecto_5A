<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARNNY | Productos</title>
    <link rel="stylesheet" href="../css/EstilosProduct.css">
</head>
<body>

<div id="Contenedor">
    <header>
        <img src="../Imagenes/logo.png" id="logo">
        <h1>Carniceria "Mi Mary"</h1>
        <span class="openbtn" onclick="openNav()">&#9776;</span>
    </header>
    <div id="myNav" class="overlay">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <div class="overlay-content"><br>
            <a href="Ofertas.html"><img src="../Imagenes/Iconos/Oferta.ico" id="Iconos"> Ofertas</a><br><hr>
            <a href="Contactos.html"><img src="../Imagenes/Iconos/Contact.ico" id="Iconos"> Contacto</a><br><hr>
            <a href="http://localhost:3000/logout"><img src="../Imagenes/Iconos/Exit.ico" id="Iconos"> Cerrar Sesión</a><br><hr>
        </div>
    </div>
</div>

<br><br>

<form class="form-busqueda" onsubmit="return false;">
    <input type="text" placeholder="🔍 Buscar producto...">
    <button type="button">Buscar</button>
</form>

<br><br>

<div class="container">

    <div class="card">
        <img src="../Imagenes/Manteca.png">
        <p>Nombre: Manteca</p>
        <p>Precio Unitario: $55.00</p>

        <button type="button" onclick="detalle('Producto1.html')">VER DETALLES</button>
        <button type="button" onclick="comprar('Manteca', 55)">COMPRAR</button>
    </div>

    <div class="card">
        <img src="../Imagenes/Res.png">
        <p>Nombre: Carne de Res</p>
        <p>Precio Unitario: $220.00</p>

        <button type="button" onclick="detalle('Producto2.html')">VER DETALLES</button>
        <button type="button" onclick="comprar('Carne de Res', 220)">COMPRAR</button>
    </div>

    <div class="card">
        <img src="../Imagenes/Lomo.png">
        <p>Nombre: Lomo</p>
        <p>Precio Unitario: $120.00</p>

        <button type="button" onclick="detalle('Producto3.html')">VER DETALLES</button>
        <button type="button" onclick="comprar('Lomo', 120)">COMPRAR</button>
    </div>

    <div class="card">
        <img src="../Imagenes/Costilla.png">
        <p>Nombre: Costilla de cerdo</p>
        <p>Precio Unitario: $120.00</p>

        <button type="button" onclick="detalle('Producto4.html')">VER DETALLES</button>
        <button type="button" onclick="comprar('Costilla de cerdo', 120)">COMPRAR</button>
    </div>

</div>

<script>
    function openNav() {
        document.getElementById("myNav").style.height = "260px";
    }

    function closeNav() {
        document.getElementById("myNav").style.height = "0";
    }

    function detalle(ruta) {
        window.location.href = `/html/${ruta}`;
    }

    async function comprar(nombre, precio) {

        try {
            const res = await fetch('http://localhost:3000/api/pago/crear-sesion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ nombre, precio })
            });

            const data = await res.json();

            if (!data.url) {
                alert("Error al generar pago");
                return;
            }

            window.location.href = data.url;

        } catch (error) {
            alert("Error en el pago");
            console.error(error);
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="../CSS/EstilosInicio.css">
</head>

<body>
    <div id="Contenedor">
        <header id="uno">
            <img src="../Imagenes/logo.png" id="logo">
            <h1 align="center">Carniceria "Mi Mary"</h1>
            <nav>
                <ul>
                    <li><a href="../HTML/PantallaRegistro.html">Registrarse</a></li>
                </ul>
            </nav>
        </header>
    </div>
    
    <section id="uno">
        <section id="form">
            <form id="formLogin">
                <legend>Inicio de Sesión</legend>
                
                <label for="correoContacto">Correo electronico:</label><br>
                <input id="correoContacto" type="email" size="40" required placeholder="correo@dominio.ext"><br>
                
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" size="40" placeholder="Ingresa tu contraseña" required><br><br>
                
                <label for="verificarPassword">Verificar contraseña:</label><br>
                <input type="password" id="verificarPassword" size="40" placeholder="Repite tu contraseña" required>
                
                <h5>¿Se te ha olvidado tu contraseña?
                    <a href="../HTML/ValidarContraseña.html" id="valC">Crear Contraseña</a>
                </h5>
                <br>
                
                <div class="botones">
                    <button type="submit" id="siguiente">Siguiente</button>
                </div>
                
                <br>
                <p id="Cont">------ O continua con ------</p>
                <br>
                
                <button type="button" id="btnGoogle">
                    <img src="../Imagenes/Iconos/Google.png" id="ImgGo">
                    <a href="http://localhost:3000/auth/google" id="G">Continuar con Google</a>
                </button>
                <br><br>
                
                <button type="button" id="btnFacebook">
                    <img src="../Imagenes/Iconos/" id="ImgFa"> 
                    <a href="/auth/github" id="F">Continuar con GitHub</a>
                </button><br>
            </form>
        </section>
    </section>

    <!-- TOAST -->
    <div id="toast"></div>

    <script>
        const API_URL = 'http://localhost:4000';

        function mostrarToast(mensaje, tipo) {
            const toast = document.getElementById('toast');
            
            toast.textContent = mensaje;
            toast.className = 'show ' + tipo;

            setTimeout(() => {
                toast.className = toast.className.replace('show', '');
            }, 3000);
        }
        
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const correo = document.getElementById('correoContacto').value.trim();
            const password = document.getElementById('password').value;
            const verificarPassword = document.getElementById('verificarPassword').value;
            
            if (!correo || !password || !verificarPassword) {
                mostrarToast('⚠️ Completa todos los campos', 'error');
                return;
            }

            if (password !== verificarPassword) {
                mostrarToast('❌ Las contraseñas no coinciden', 'error');
                return;
            }

            if (!correo.includes('@')) {
                mostrarToast('⚠️ Ingresa un correo válido', 'error');
                return;
            }
            
            try {
                const respuesta = await fetch(`${API_URL}/api/own/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ correo, password })
                });
                
                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    mostrarToast(' Bienvenido ' + resultado.usuario.nombre, 'success');
                    
                    localStorage.setItem('usuario', JSON.stringify(resultado.usuario));
                    
                    setTimeout(() => {
                        window.location.href = "../HTML/PantallaInicio.html";
                    }, 1000);
                    
                } else {
                    mostrarToast('❌ ' + (resultado.error || 'Correo o contraseña incorrectos'), 'error');
                }
                
            } catch (error) {
                mostrarToast('❌ Error de conexión con el servidor', 'error');
                console.error('Error:', error);
            }
        });
        
    </script>
</body>
</html>

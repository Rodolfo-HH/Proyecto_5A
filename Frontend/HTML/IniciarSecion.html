<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="/Frontend/CSS/EstilosInicio.css">
</head>
<body>
    <div id="Contenedor">
        <header id="uno">
        <img src="/Frontend/Imagenes/logo.png" id="logo">
            <h1 align="center">Carniceria "Mi Mary"</h1>
            <nav>
                <ul>
                    <li><a href="/Frontend/HTML/PantallaRegistro.html">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section id="uno">
        <section id="form">
            <form>
                    <legend>Inicio de Sesión</legend>
                    <label for="correoContacto">Correo electronico:</label><br>
                    <input id="correoContacto" type="email" size="40" required placeholder="correo.@dominio.ext"><br>
                    <label for="password">La contraseña de contener:</label>
                    <ul>
                        <li>Minimo 8 caracteres</li>
                        <li>Una mayúscula</li>
                        <li>Un numero</li>
                        <li>Un simbolo</li>
                    </ul>
                    <input type="password" id="password" size="40" placeholder="Ingresa tu contraseña" maxlength="8" required>
                    <p id="mensaje"></p>
                    <h5>¿Se te a olvidado tu contraseña?<a href="ValidarContraseña.html" id="valC">Crear Contraseña</a></h5>
                    <br>
                    <div class="botones">
                        <button type="submit" id="siguiente" onclick="validar()">Siguiente</button>
                    </div>
                    </div>
                    <br>
                    <p id="Cont">------ O continua con ------</p>
                    <br>
                    <button type="submit" id="btnGoogle"><img src="/Frontend/Imagenes/Iconos/Googleicon.ico" id="ImgGo"><a href="" id="G">Continuar con Google</a></button>
                    <br>
                    <br>
                    <button type="submit" id="btnFacebook"><img src="/Frontend/Imagenes/Iconos/Facebookicon.ico" id="ImgFa"> <a href="" id="F">Continuar con Facebook</a></button><br>
                    
                    <script>
                        function validar() {
                        const password = document.getElementById('password').value;
                        const mensaje = document.getElementById('mensaje');

                        // Reglas: al menos una mayúscula, un número, un símbolo y máximo 8 caracteres
                        const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_\-+=<>?]).{1,8}$/;

                            if (!regex.test(password)) {
                                mensaje.style.color = '#ffb3b3';
                                mensaje.textContent = 'La contraseña debe tener al menos una mayúscula, un número y un símbolo.';
                            } else {
                                mensaje.style.color = '#b2ff59';
                                mensaje.textContent = 'Contraseña válida. Puedes continuar.';
                                window.location.href = "PantallaInicio.html";
                            }
                        }


                    </script>

            </form>
        </section>
    </section>
</body>
</html>

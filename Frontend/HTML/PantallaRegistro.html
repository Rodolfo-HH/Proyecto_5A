<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Frontend/CSS/EstilosRegistro.css">
    <title>Registrate</title>
</head>
<body>
    <div id="Contenedor">
        <header>
            <img src="/Frontend/Imagenes/logo.png" id="logo">
            <h1>Carniceria "Mi Mary"</h1>
            <nav>
                <ul>
                    <li><a href="PantallaPrincipal.html">Salir</a></li>
                </ul>
            </nav>
        </header>
    </div>
    <section>
        <section id="sec">
            <form id="formRegistro">
                <legend>Registrate</legend>
                <h4>Datos Personales</h4>
                <label for="nombre">Nombre/Usuario:</label><br>
                <input id="nombre" name="nombre" type="text" size="50" placeholder="Ingresa tu nombre..." required><br>
                
                <label for="correo">Correo electronico:</label><br>
                <input id="correo" name="correo" type="email" size="50" placeholder="correo@ejemplo.com" required><br>
                
                <label for="telefono">Telefono:</label><br>
                <input id="telefono" name="telefono" type="tel" placeholder="p.e: 555-540-60-70" required><br>
                
                <label for="direccion">Dirección:</label><br>
                <input id="direccion" name="direccion" type="text" size="50" placeholder="Ingresa tu dirección..." required><br>
                
                <label for="password">Contraseña:</label><br>
                <input id="password" name="password" type="password" size="50" placeholder="Crea una contraseña" required><br>
                
                <label for="confirmarPassword">Confirmar contraseña:</label><br>
                <input id="confirmarPassword" type="password" size="50" placeholder="Repite tu contraseña" required><br>
                
                <br>
                <div class="botones">
                    <button id="continuar" type="submit">Continuar</button>
                </div>
                <br>
                <p id="Cont">------ O continuar con ------</p>
                <br>
                <button type="button" id="btnGoogle"><img src="/Frontend/Imagenes/Iconos/Googleicon.ico" id="ImgGo"><a href="" id="G">Continuar con Google</a></button>
                <br>
                <br>
                <button type="button" id="btnFacebook"><img src="/Frontend/Imagenes/Iconos/Facebookicon.ico" id="ImgFa"> <a href="" id="F">Continuar con Facebook</a></button><br>
            </form>
        </section>
    </section>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const telefono = document.getElementById("telefono").value.trim();
            const direccion = document.getElementById("direccion").value.trim();
            const password = document.getElementById("password").value;
            const confirmarPassword = document.getElementById("confirmarPassword").value;

            if(nombre === "" || correo === "" || telefono === "" || direccion === "" || password === ""){
                alert("⚠️ Por favor llena todos los campos");
                return;
            }

            if(!correo.includes("@")){
                alert("⚠️ Ingresa un correo válido");
                return;
            }

            if(password !== confirmarPassword){
                alert("⚠️ Las contraseñas no coinciden");
                return;
            }

            if(password.length < 8){
                alert("⚠️ La contraseña debe tener al menos 8 caracteres");
                return;
            }

            // Enviar al backend
            const datos = {
                nombre,
                correo,
                telefono,
                direccion,
                password
            };
            
            try {
                const respuesta = await fetch('http://localhost:3000/api/own/auth/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });
                
                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    alert('¡Registro exitoso!');
                    window.location.href = "PantallaInicio.html";
                } else {
                    alert(resultado.error || 'Error en el registro');
                }
            } catch (error) {
                alert('Error de conexión. Verifica que el servidor esté corriendo.');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/EstilosRegistro.css">
    <title>Registrate</title>
</head>
<body>
    <div id="Contenedor">
        <header>
            <img src="../Imagenes/logo.png" id="logo">
            <h1>Carniceria "Mi Mary"</h1>
            <nav>
                <ul>
                    <li><a href="PantallaPrincipal.html">Salir</a></li>
                </ul>
            </nav>
        </header>
    </div>
    <section>
        <section id="sec">
            <form id="formRegistro">
                <legend>Registrate</legend>
                <h4>Datos Personales</h4>
                
                <label for="nombre">Nombre/Usuario:</label>
                <input id="nombre" name="nombre" type="text" placeholder="Ingresa tu nombre..." required>
                
                <label for="correo">Correo electronico:</label>
                <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required>
                
                <label for="telefono">Telefono:</label>
                <input id="telefono" name="telefono" type="tel" placeholder="p.e: 555-540-60-70" required>
                
                <label for="direccion">Dirección:</label>
                <input id="direccion" name="direccion" type="text" placeholder="Ingresa tu dirección..." required>
                
                <label for="password">Contraseña:</label>
                <input id="password" name="password" type="password" placeholder="Crea una contraseña" required>
                
                <label for="confirmarPassword">Confirmar contraseña:</label>
                <input id="confirmarPassword" type="password" placeholder="Repite tu contraseña" required>
                
                <button id="continuar" type="submit">Continuar</button>
                
                <p id="Cont">------ O continuar con ------</p>
                
                <button type="button" id="btnGoogle">
                    <img src="../Imagenes/Iconos/Googleicon.ico" id="ImgGo">
                    <a href="http://localhost:3000/auth/google" id="G">Continuar con Google</a>
                </button>
                
                <button type="button" id="btnFacebook">
                    <img src="../Imagenes/Iconos/" id="ImgFa">
                    <a href="" id="F">Continuar con Facebook</a>
                </button>
            </form>
        </section>
    </section>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const telefono = document.getElementById("telefono").value.trim();
            const direccion = document.getElementById("direccion").value.trim();
            const password = document.getElementById("password").value;
            const confirmarPassword = document.getElementById("confirmarPassword").value;

            if(nombre === "" || correo === "" || telefono === "" || direccion === "" || password === ""){
                alert("⚠️ Por favor llena todos los campos");
                return;
            }

            if(!correo.includes("@")){
                alert("⚠️ Ingresa un correo válido");
                return;
            }

            if(password !== confirmarPassword){
                alert("⚠️ Las contraseñas no coinciden");
                return;
            }

            if(password.length < 8){
                alert("⚠️ La contraseña debe tener al menos 8 caracteres");
                return;
            }

            const datos = { nombre, correo, telefono, direccion, password };
            
            try {
                const respuesta = await fetch('http://localhost:3000/api/own/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                
                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    alert('¡Registro exitoso! Ahora inicia sesión.');
                    // REDIRIGIR A INICIAR SESIÓN
                    window.location.href = "IniciarSecion.html";
                } else {
                    alert(resultado.error || 'Error en el registro');
                }
            } catch (error) {
                alert('Error de conexión. Verifica que el servidor esté corriendo.');
                console.error(error);
            }
        });
    </script>
</body>
</html>

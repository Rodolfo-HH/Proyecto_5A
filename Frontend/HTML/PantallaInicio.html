<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | CARNNY</title>
    <link rel="stylesheet" href="../css/EstilosP_v2.css">
</head>
<body>
    <div id="Contenedor">
        <header>
            <img src="../Imagenes/logo.png" id="logo">
            <form class="form-busqueda">
                <input type="text" placeholder="Buscar...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
            <span class="openbtn" onclick="openNav()">&#9776;</span>
        </header>
        <div id="myNav" class="overlay">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
            <div class="oevrlay-content"><br>
                <a href="Productos.html"><img src="../Imagenes/Iconos/Product.ico" id="Iconos">Productos</a><br><br><hr>
                <a href="Ofertas.html"><img src="../Imagenes/Iconos/Oferta.ico" id="Iconos">Ofertas</a><br><br><hr>
                <a href="Contactos.html"><img src="../Imagenes/Iconos/Contact.ico" id="Iconos">Contacto</a><br><br><hr>
                <a href="PantallaPrincipal.html" id="linkCerrarSesion"><img src="../Imagenes/Iconos/Exit.ico" id="Iconos">Cerrar Sesión</a><br><br><hr>
            </div>
        </div>
    </div>
        
        <script>
            function openNav() {
                document.getElementById("myNav").style.height = "260px";
            }

            function closeNav() {
                document.getElementById("myNav").style.height = "0%";
            }
        </script>

        <br>
        <br>

        <section id="Seccion0">
            <section id="Seccion1">
                <img src="../Imagenes/banner1.png" id="banner1">
            </section>
            <section id="Seccion2">
                <img src="../Imagenes/banner2.jpeg" id="banner2">
            </section>
            <section id="Texto">
                <p>"Aprobecha nuestras ofertas del día:"<br>
                    Carne fresca, precios accesibles y cortes algusto.<br>
                    ¡¡¡No pierdas la oportunidad de llevar calidad a tu mesa sin gastar de más!!!<br>
                    <br>
                    <br>
                </p>
            </section>
        </section>

        <section id="Seccion5">
            <section id="Seccion6">
            </section>
        </section>

        <button type="submit" id="button1" onclick="siguiente1()">Ver Catalogo</button>
        <button type="submit" id="button2" onclick="siguiente2()">Hacer Pedido</button>

        <footer>
            <div class="contacto">Teléfono: <span>764 764 3868</span></div>
            <div class="contacto">WhatsApp: <span>764 117 85 68</span></div>
            <div class="contacto">Facebook: <span>Carniceria "Mi Mary"</span></div>
        </footer>
        
        <script>
            // Verificar usuario logueado
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            
            if (usuario) {
                console.log('Usuario logueado:', usuario.nombre);
                // Cambiar "Cerrar Sesión" por el nombre del usuario
                const linkCerrar = document.getElementById('linkCerrarSesion');
                linkCerrar.innerHTML = `<img src="../Imagenes/Iconos/Exit.ico" id="Iconos">${usuario.nombre} (Salir)`;
            }
            
            // Manejar cierre de sesión
            document.getElementById('linkCerrarSesion').addEventListener('click', function(e) {
                localStorage.removeItem('usuario');
                // No prevenir el comportamiento por defecto, dejar que vaya a PantallaPrincipalv1.html
            });
            
            function siguiente1(){
                window.location.href = "Productos.html"
            }
            function siguiente2(){
                // Verificar si está logueado antes de hacer pedido
                if (!usuario) {
                    alert('Debes iniciar sesión para hacer un pedido');
                    window.location.href = "IniciarSecion.html";
                    return;
                }
                window.location.href = "Pedidos.html"
            }
        </script>
</body>
</html>
